name: one-shot cross-source repair

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply multi-root decorators
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path: str, pairs: list[tuple[str, str]]) -> None:
              p = Path(path)
              text = p.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"missing expected source in {path}: {old!r}")
                  text = text.replace(old, new, 1)
              p.write_text(text)

          edit("src/paic/analytics/validation.py", [
              ("from paic.artifacts.lease import artifact_reader\n", "from paic.artifacts.lease import artifact_readers\n"),
              ("@artifact_reader\ndef validate_analytics_directory(\n", "@artifact_readers(\"analytics_dir\", \"dataset_dir\")\ndef validate_analytics_directory(\n"),
          ])
          edit("src/paic/detection/validation.py", [
              ("from paic.artifacts.lease import artifact_reader\n", "from paic.artifacts.lease import artifact_readers\n"),
              ("@artifact_reader\ndef validate_detection_directory(\n", "@artifact_readers(\"detection_dir\", \"analytics_dir\")\ndef validate_detection_directory(\n"),
          ])
          edit("src/paic/impact/validation.py", [
              ("from paic.artifacts.lease import artifact_reader\n", "from paic.artifacts.lease import artifact_readers\n"),
              ("@artifact_reader\ndef validate_impact_directory(\n", "@artifact_readers(\"impact_dir\", \"dataset_dir\")\ndef validate_impact_directory(\n"),
          ])
          edit("src/paic/evidence/validation.py", [
              ("from paic.artifacts.lease import artifact_reader\n", "from paic.artifacts.lease import artifact_readers\n"),
              ("@artifact_reader\ndef validate_evidence_directory(\n", "@artifact_readers(\n    \"evidence_dir\", \"dataset_dir\", \"analytics_dir\", \"detection_dir\", \"impact_dir\"\n)\ndef validate_evidence_directory(\n"),
          ])
          edit("src/paic/investigation/artifact.py", [
              ("from paic.artifacts.lease import artifact_reader\n", "from paic.artifacts.lease import artifact_reader, artifact_readers\n"),
              ("@artifact_reader\ndef validate_investigation(\n", "@artifact_readers(\n    \"path\", \"dataset_dir\", \"analytics_dir\", \"detection_dir\", \"impact_dir\", \"evidence_dir\"\n)\ndef validate_investigation(\n"),
              ("def replay_investigation(\n", "@artifact_readers(\n    \"path\", \"dataset_dir\", \"analytics_dir\", \"detection_dir\", \"impact_dir\", \"evidence_dir\"\n)\ndef replay_investigation(\n"),
          ])
          PY
      - name: Install and format
        run: |
          python -m pip install -e ".[dev]"
          ruff format .
          ruff check --fix .
          ruff format .
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/one-shot-cross-source-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Coordinate all cross-source validation snapshots"
          git push origin HEAD:agent/phase11-fix-review2
