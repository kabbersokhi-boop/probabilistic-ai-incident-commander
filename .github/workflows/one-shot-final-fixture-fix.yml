name: one-shot final fixture fix

on:
  push:
    paths:
      - .review2-final-fixture-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase11-fix-review2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Patch fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          publication_test = Path('tests/test_atomic_publication.py')
          text = publication_test.read_text()
          old = 'monkeypatch.setattr(os, "replace", lambda *_args: (_ for _ in ()).throw(OSError("blocked")))'
          new = 'monkeypatch.setattr(\n        os,\n        "replace",\n        lambda *_args, **_kwargs: (_ for _ in ()).throw(OSError("blocked")),\n    )'
          if old not in text:
              raise SystemExit('publication fixture pattern not found')
          publication_test.write_text(text.replace(old, new, 1))

          investigation_test = Path('tests/test_investigation_unit.py')
          text = investigation_test.read_text()
          old = '''    monkeypatch.setattr(
        "paic.investigation.artifact.bind_sources",
        lambda *args, **kwargs: SimpleNamespace(hashes={"dataset": "f" * 64}),
    )
    assert any(
        "source manifest hashes" in issue
        for issue in validate_investigation(output, dataset_dir="/unused")
    )'''
          new = '''    dataset_dir = tmp_path / "dataset-source"
    dataset_dir.mkdir()
    monkeypatch.setattr(
        "paic.investigation.artifact.bind_sources",
        lambda *args, **kwargs: SimpleNamespace(hashes={"dataset": "f" * 64}),
    )
    assert any(
        "source manifest hashes" in issue
        for issue in validate_investigation(output, dataset_dir=dataset_dir)
    )'''
          if old not in text:
              raise SystemExit('investigation fixture pattern not found')
          investigation_test.write_text(text.replace(old, new, 1))
          PY
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify focused failures
        run: |
          python -m ruff format tests/test_atomic_publication.py tests/test_investigation_unit.py
          python -m ruff check tests/test_atomic_publication.py tests/test_investigation_unit.py
          python -m pytest -q \
            tests/test_atomic_publication.py::test_failed_rollback_preserves_backup_and_reports_recovery_path \
            tests/test_investigation_unit.py::test_artifact_semantic_tampering_and_source_mismatch
      - name: Commit fixes and remove helper
        run: |
          rm -f .github/workflows/one-shot-final-fixture-fix.yml .review2-final-fixture-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_atomic_publication.py tests/test_investigation_unit.py .github/workflows/one-shot-final-fixture-fix.yml .review2-final-fixture-trigger
          git commit -m 'Fix hardened lease test fixtures'
          git push origin HEAD:agent/phase11-fix-review2
