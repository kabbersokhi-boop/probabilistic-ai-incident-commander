name: one-shot fix3 diagnostic

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Execute embedded patch and capture failure
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/one-shot-reader-fix3.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          Path('/tmp/fix3.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end]) + '\n')
          PY
          set +e
          python /tmp/fix3.py > review2-fix3-diagnostic.txt 2>&1
          printf '\nexit_code=%s\n' "$?" >> review2-fix3-diagnostic.txt
          git diff --stat >> review2-fix3-diagnostic.txt
          rm -f .github/workflows/one-shot-fix3-diagnostic.yml .review2-fix3-diagnostic-trigger
          rm -f .github/workflows/one-shot-reader-fix3.yml .review2-reader-fix3-trigger
      - name: Commit diagnostic and partial edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture anchored proxy repair diagnostic"
          git push origin HEAD:agent/phase11-fix-review2
