name: one-shot publication formatter

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  format-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Format and verify
        run: |
          python -m pip install -e ".[dev]"
          set +e
          ruff format src/paic/artifacts/publication.py tests/test_atomic_publication.py > review2-publication-direct.txt 2>&1
          printf '\nruff_format_exit=%s\n' "$?" >> review2-publication-direct.txt
          ruff check --fix src/paic/artifacts/publication.py tests/test_atomic_publication.py >> review2-publication-direct.txt 2>&1
          printf '\nruff_check_exit=%s\n' "$?" >> review2-publication-direct.txt
          pytest -q --tb=short tests/test_atomic_publication.py >> review2-publication-direct.txt 2>&1
          printf '\npytest_exit=%s\n' "$?" >> review2-publication-direct.txt
          mypy --strict src tests >> review2-publication-direct.txt 2>&1
          printf '\nmypy_exit=%s\n' "$?" >> review2-publication-direct.txt
          rm -f .github/workflows/one-shot-format-publication.yml .review2-format-publication-trigger .review2-publication-repair-trigger
      - name: Commit formatted repair and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format and verify publication repair"
          git push origin HEAD:agent/phase11-fix-review2
