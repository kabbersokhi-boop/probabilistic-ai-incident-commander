name: one-shot branch formatter

on:
  push:
    branches:
      - agent/phase11-final

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install repository tooling
        run: python -m pip install -e ".[dev]"
      - name: Apply canonical formatting
        run: ruff format .
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-format.yml
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply canonical Ruff formatting"
          git push origin HEAD:agent/phase11-final
