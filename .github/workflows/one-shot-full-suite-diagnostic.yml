name: one-shot full-suite diagnostic

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Capture full-suite failures
        run: |
          python -m pip install -e ".[dev]"
          set +e
          pytest -q --tb=short > review2-final-pytest.txt 2>&1
          printf '\npytest_exit=%s\n' "$?" >> review2-final-pytest.txt
          rm -f .github/workflows/one-shot-full-suite-diagnostic.yml
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture final full-suite failures"
          git push origin HEAD:agent/phase11-fix-review2
