name: one-shot source hardening

on:
  push:
    branches:
      - agent/phase11-final

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply final source-boundary fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path: str, replacements: list[tuple[str, str]]) -> None:
              target = Path(path)
              text = target.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"missing expected source in {path}: {old[:80]!r}")
                  text = text.replace(old, new, 1)
              target.write_text(text)

          edit("src/paic/artifacts/lease.py", [
              (
                  "        current_parent = os.stat(self.parent, follow_symlinks=False)\n        _validate_parent_info(current_parent)\n        self._reentrant = True\n",
                  "        self.parent_fd, self.parent_info = _open_parent(self.parent)\n        self._reentrant = True\n",
              ),
              (
                  "    def validate_current_parent(self) -> None:\n        if self._reentrant:\n            _validate_parent_path(self.parent)\n            info = os.stat(self.parent, follow_symlinks=False)\n            _validate_parent_info(info)\n            return\n        if self.parent_fd is None or self.parent_info is None:\n",
                  "    def validate_current_parent(self) -> None:\n        if self.parent_fd is None or self.parent_info is None:\n",
              ),
              (
                  "    def release(self) -> None:\n        if self._reentrant:\n            self._unmark_active()\n            self._reentrant = False\n            return\n",
                  "    def release(self) -> None:\n        if self._reentrant:\n            error: ArtifactLeaseError | None = None\n            try:\n                self.validate_current_parent()\n            except ArtifactLeaseError as exc:\n                error = exc\n            close_error = _release_descriptor(\"artifact parent\", self.parent_fd, False)\n            self.parent_fd = None\n            self.parent_info = None\n            self._unmark_active()\n            self._reentrant = False\n            if error is not None:\n                raise error\n            if close_error is not None:\n                raise close_error\n            return\n",
              ),
          ])

          edit("src/paic/remediation/artifact.py", [
              ("from paic.artifacts.lease import artifact_reader\n", "from paic.artifacts.lease import artifact_reader, artifact_readers\n"),
              ("def manifest_sha256(path: str | Path) -> str:\n", "@artifact_reader\ndef manifest_sha256(path: str | Path) -> str:\n"),
              ("def validate_plan(\n", "@artifact_readers(\n    \"path\",\n    \"investigation_dir\",\n    \"control_state_dir\",\n    \"dataset_dir\",\n    \"analytics_dir\",\n    \"detection_dir\",\n    \"impact_dir\",\n    \"evidence_dir\",\n)\ndef validate_plan(\n"),
              ("def validate_execution(\n", "@artifact_readers(\"path\", \"plan_dir\", \"before_state_dir\", \"after_state_dir\")\ndef validate_execution(\n"),
          ])

          edit("src/paic/evaluation/artifact.py", [
              ("from paic.artifacts.lease import artifact_reader\n", "from paic.artifacts.lease import artifact_reader, artifact_readers\n"),
              ("@artifact_reader\ndef replay_evaluation(\n", "@artifact_readers(\"root\", \"visible_dir\", \"answers_dir\")\ndef replay_evaluation(\n"),
          ])

          edit("src/paic/evaluation/comparison.py", [
              ("from paic.artifacts.lease import artifact_reader\n", "from paic.artifacts.lease import artifact_reader, artifact_readers\n"),
              ("def compare_runs(\n", "@artifact_readers(\"left_dir\", \"right_dir\", \"visible_dir\", \"answers_dir\")\ndef compare_runs(\n"),
              ("def replay_comparison(\n", "@artifact_readers(\n    \"comparison_dir\", \"left_dir\", \"right_dir\", \"visible_dir\", \"answers_dir\"\n)\ndef replay_comparison(\n"),
          ])
          PY
      - name: Install repository tooling
        run: python -m pip install -e ".[dev]"
      - name: Apply canonical formatting
        run: ruff format .
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-hardening.yml
      - name: Commit final hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete source snapshot coordination"
          git push origin HEAD:agent/phase11-final
