name: one-shot import ordering correction

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Correct publication import ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/paic/artifacts/publication.py")
          text = path.read_text()
          old = "import ctypes\nfrom contextlib import suppress\nimport os\nimport secrets\nimport shutil\nimport stat\nfrom collections.abc import Callable\n"
          new = "import ctypes\nimport os\nimport secrets\nimport shutil\nimport stat\nfrom collections.abc import Callable\nfrom contextlib import suppress\n"
          if old not in text:
              raise SystemExit("publication import block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/one-shot-import-order.yml
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct publication import ordering"
          git push origin HEAD:agent/phase11-fix-review2
