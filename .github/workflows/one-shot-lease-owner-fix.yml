name: one-shot lease owner diagnostic

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Capture source anchors
        run: |
          python - <<'PY' > owner-repair-diagnostic.txt 2>&1
          from pathlib import Path
          text = Path('src/paic/artifacts/lease.py').read_text()
          checks = [
              'import contextvars\n',
              'import time\n',
              '_ACTIVE_DOMAINS: contextvars.ContextVar[dict[str, tuple[bool, int]] | None]',
              '    def _enter_reentrant_if_safe(self) -> bool:\n',
              '    def _mark_active(self) -> None:\n',
              '    def acquire_intent(self) -> None:\n',
              '    ordered: dict[str, Path] = {}\n',
          ]
          for item in checks:
              print(repr(item), text.count(item))
          PY
      - name: Remove workflow and trigger marker
        run: |
          rm .github/workflows/one-shot-lease-owner-fix.yml .review2-trigger
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture owner repair diagnostics"
          git push origin HEAD:agent/phase11-fix-review2
