name: one-shot lint report

on:
  push:
    branches:
      - agent/phase11-final

permissions:
  contents: write

jobs:
  lint-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install repository tooling
        run: python -m pip install -e ".[dev]"
      - name: Capture concise lint output
        run: ruff check --output-format concise . > ruff-lint.txt 2>&1 || true
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-lint-report.yml
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture Ruff lint diagnostics"
          git push origin HEAD:agent/phase11-final
