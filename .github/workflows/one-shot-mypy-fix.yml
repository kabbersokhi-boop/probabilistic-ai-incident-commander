name: one-shot mypy fix

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply all strict typing fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          def edit(path: str, replacements: list[tuple[str, str]]) -> None:
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing in {path}: {old[:100]!r}')
                  text = text.replace(old, new, 1)
              p.write_text(text)

          edit('tests/test_phase11_evidence_freshness.py', [
              ('import json\nfrom pathlib import Path\n', 'import json\nfrom pathlib import Path\nfrom types import ModuleType\n'),
              ('def _module():\n', 'def _module() -> ModuleType:\n'),
              ('@pytest.mark.parametrize("value", [None, 0, 1, "false", [], {}])\n', '@pytest.mark.parametrize("value", [None, 0, 1, "false", [], {}])  # type: ignore[untyped-decorator]\n'),
          ])
          edit('src/paic/artifacts/lease.py', [
              ('    try:\n        parts = Path(os.fspath(value)).parts\n    except TypeError:\n        return None\n', '    if not isinstance(value, (str, os.PathLike)):\n        return None\n    parts = Path(os.fspath(value)).parts\n'),
              ('    return cast(tuple[int, int, int, int], parts)\n', '    return parts[0], parts[1], parts[2], parts[3]\n'),
          ])
          edit('src/paic/artifacts/publication.py', [
              ('            if not self.committed and self.backup is not None and not self._target_exists():\n                try:\n                    os.replace(\n                        self.backup.name,\n', '            if not self.committed and self.backup is not None and not self._target_exists():\n                backup = self.backup\n                try:\n                    os.replace(\n                        backup.name,\n'),
              ('                        f"{self._root.parent / self.backup.name}: {restore_exc}"\n', '                        f"{self._root.parent / backup.name}: {restore_exc}"\n'),
          ])
          edit('tests/test_atomic_publication.py', [
              ('    with pytest.raises(OSError, match="unavailable"):\n        publication._rename_exchange(tmp_path / "left", tmp_path / "right")\n', '    parent_fd = os.open(tmp_path, os.O_RDONLY)\n    try:\n        with pytest.raises(OSError, match="unavailable"):\n            publication._rename_exchange_at(parent_fd, "left", "right")\n    finally:\n        os.close(parent_fd)\n'),
              ('    with pytest.raises(OSError, match="cross-device"):\n        publication._rename_exchange(tmp_path / "left", tmp_path / "right")\n', '    parent_fd = os.open(tmp_path, os.O_RDONLY)\n    try:\n        with pytest.raises(OSError, match="cross-device"):\n            publication._rename_exchange_at(parent_fd, "left", "right")\n    finally:\n        os.close(parent_fd)\n'),
          ])
          PY
      - name: Format and verify mypy
        run: |
          python -m pip install -e ".[dev]"
          ruff format .
          mypy src tests
      - name: Remove diagnostics and workflow
        run: rm .github/workflows/one-shot-mypy-fix.yml review2-mypy.txt
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve strict typing regressions"
          git push origin HEAD:agent/phase11-fix-review2
