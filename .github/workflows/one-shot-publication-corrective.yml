name: one-shot publication corrective validation

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  correct-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Restore focused test edit and fix lint
        run: |
          git show f8a10785a9c1695333f670427d52891e310ad03b:tests/test_atomic_publication.py > tests/test_atomic_publication.py
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_atomic_publication.py")
          tests = test_path.read_text()
          old = '''    def unavailable(_left: Path, _right: Path) -> None:
        raise failure

    monkeypatch.setattr(publication, "_rename_exchange", unavailable)
'''
          new = '''    def unavailable(_parent_fd: int, _left_name: str, _right_name: str) -> None:
        raise failure

    monkeypatch.setattr(publication, "_rename_exchange_at", unavailable)
'''
          if old not in tests:
              raise SystemExit("exchange seam not found")
          test_path.write_text(tests.replace(old, new))

          source_path = Path("src/paic/artifacts/publication.py")
          source = source_path.read_text()
          source = source.replace("import ctypes\n", "import ctypes\nfrom contextlib import suppress\n")
          source = source.replace(
              '''            if descriptor is not None:
                try:
                    os.close(descriptor)
                except OSError:
                    pass
''',
              '''            if descriptor is not None:
                with suppress(OSError):
                    os.close(descriptor)
''',
          )
          source_path.write_text(source)
          PY
          python -m pip install -e ".[dev]"
          set +e
          ruff format src/paic/artifacts/publication.py tests/test_atomic_publication.py > review2-publication-corrective.txt 2>&1
          printf '\nruff_format_exit=%s\n' "$?" >> review2-publication-corrective.txt
          ruff check src/paic/artifacts/publication.py tests/test_atomic_publication.py >> review2-publication-corrective.txt 2>&1
          printf '\nruff_check_exit=%s\n' "$?" >> review2-publication-corrective.txt
          pytest -q --tb=short tests/test_atomic_publication.py >> review2-publication-corrective.txt 2>&1
          printf '\npytest_exit=%s\n' "$?" >> review2-publication-corrective.txt
          mypy --strict src tests >> review2-publication-corrective.txt 2>&1
          printf '\nmypy_exit=%s\n' "$?" >> review2-publication-corrective.txt
          rm -f .github/workflows/one-shot-publication-corrective.yml .review2-publication-corrective-trigger review2-publication-direct.txt
      - name: Commit corrective repair and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct publication tests and lint"
          git push origin HEAD:agent/phase11-fix-review2
