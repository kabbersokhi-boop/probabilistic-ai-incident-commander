name: one-shot publication lifecycle repair

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Repair publication lifecycle
        run: |
          set +e
          python - <<'PY' > review2-publication-repair.txt 2>&1
          from pathlib import Path

          path = Path("src/paic/artifacts/publication.py")
          text = path.read_text()
          text = text.replace(
              "from paic.artifacts.lease import _ArtifactLease, artifact_lease",
              "from paic.artifacts.lease import ArtifactLeaseError, _ArtifactLease, artifact_lease",
          )
          text = text.replace(
              "        self._lease: _ArtifactLease | None = None\n",
              "        self._lease: _ArtifactLease | None = None\n"
              "        self._parent_anchor_fd: int | None = None\n"
              "        self._parent_anchor_identity: tuple[int, int] | None = None\n",
          )
          old_parent = '''    def _parent_fd(self) -> int:
        if self._lease is None or self._lease.parent_fd is None:
            raise ArtifactPublicationError("publisher lease parent was not acquired")
        return self._lease.parent_fd

    def _parent_entry(self, name: str) -> Path:
        """Return the lexical sibling path while descriptor-relative syscalls stay authoritative."""
        return self._root.parent / name
'''
          new_parent = '''    def _open_parent_anchor(self) -> int:
        if self._parent_anchor_fd is not None:
            return self._parent_anchor_fd
        fd: int | None = None
        try:
            if self._lease is not None and self._lease.parent_fd is not None:
                fd = os.dup(self._lease.parent_fd)
            else:
                flags = os.O_RDONLY | getattr(os, "O_DIRECTORY", 0)
                flags |= getattr(os, "O_CLOEXEC", 0) | getattr(os, "O_NOFOLLOW", 0)
                fd = os.open(self._root.parent, flags)
            info = os.fstat(fd)
            current = os.stat(self._root.parent, follow_symlinks=False)
            if (
                not stat.S_ISDIR(info.st_mode)
                or info.st_dev != current.st_dev
                or info.st_ino != current.st_ino
            ):
                raise ArtifactPublicationError("artifact publication parent changed")
            self._parent_anchor_fd = fd
            self._parent_anchor_identity = (info.st_dev, info.st_ino)
            return fd
        except ArtifactPublicationError:
            if fd is not None:
                try:
                    os.close(fd)
                except OSError:
                    pass
            raise
        except OSError as exc:
            if fd is not None:
                try:
                    os.close(fd)
                except OSError:
                    pass
            raise ArtifactPublicationError(f"cannot acquire artifact publication parent: {exc}") from exc

    def _parent_fd(self) -> int:
        return self._open_parent_anchor()

    def _validate_parent_anchor(self) -> None:
        fd = self._parent_fd()
        try:
            descriptor = os.fstat(fd)
            current = os.stat(self._root.parent, follow_symlinks=False)
        except OSError as exc:
            raise ArtifactPublicationError("artifact publication parent changed") from exc
        expected = self._parent_anchor_identity
        if (
            expected is None
            or not stat.S_ISDIR(descriptor.st_mode)
            or expected != (descriptor.st_dev, descriptor.st_ino)
            or expected != (current.st_dev, current.st_ino)
        ):
            raise ArtifactPublicationError("artifact publication parent changed")
        if self._lease is not None:
            self._lease.validate_current_parent()

    def _close_parent_anchor(self) -> None:
        if self._parent_anchor_fd is None:
            return
        fd = self._parent_anchor_fd
        self._parent_anchor_fd = None
        self._parent_anchor_identity = None
        try:
            os.close(fd)
        except OSError as exc:
            raise ArtifactPublicationError("cannot close artifact publication parent") from exc

    def _abort_enter(self, exc: BaseException) -> None:
        try:
            self.__exit__(type(exc), exc, exc.__traceback__)
        except BaseException as cleanup_error:
            exc.add_note(f"publisher entry cleanup failed: {cleanup_error}")

    def _parent_entry(self, name: str) -> Path:
        """Return the lexical sibling path while descriptor-relative syscalls stay authoritative."""
        return self._root.parent / name
'''
          if old_parent not in text:
              raise SystemExit("parent helper block not found")
          text = text.replace(old_parent, new_parent)

          start = text.index("    def __enter__(self) -> Path:\n")
          end = text.index("    def commit(self) -> PublicationResult:\n", start)
          new_enter = '''    def __enter__(self) -> Path:
        try:
            _assert_safe_target(self._root)
            self._root.parent.mkdir(parents=True, exist_ok=True)
            _assert_safe_target(self._root)
            self._lease = artifact_lease(self._root, exclusive=True)
            self._lease.__enter__()
            self._open_parent_anchor()
            self._validate_parent_anchor()
            if self._target_exists() and not self.overwrite:
                raise ArtifactPublicationError(f"output directory already exists: {self.target}")
            try:
                lock_info = os.stat(
                    self.lock_path.name,
                    dir_fd=self._parent_fd(),
                    follow_symlinks=False,
                )
            except FileNotFoundError:
                lock_info = None
            if lock_info is not None and not stat.S_ISREG(lock_info.st_mode):
                raise ArtifactPublicationError("artifact writer lock is not a regular file")
            flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
            flags |= getattr(os, "O_CLOEXEC", 0) | getattr(os, "O_NOFOLLOW", 0)
            self._lock_fd = os.open(
                self.lock_path.name,
                flags,
                0o600,
                dir_fd=self._parent_fd(),
            )
            lock_info = os.fstat(self._lock_fd)
            if not stat.S_ISREG(lock_info.st_mode) or lock_info.st_nlink != 1:
                raise ArtifactPublicationError("artifact writer lock is not a regular file")
            self._lock_identity = (lock_info.st_dev, lock_info.st_ino)
            os.write(self._lock_fd, f"{os.getpid()}\\n".encode())
            os.fsync(self._lock_fd)
            self._validate_parent_anchor()
            self.staging = self._make_staging()
            self._validate_parent_anchor()
            self._point("staging-created")
            return self.staging
        except FileExistsError as exc:
            self._abort_enter(exc)
            raise ArtifactPublicationError(
                f"artifact target is already locked: {self.lock_path}"
            ) from exc
        except ArtifactPublicationError as exc:
            self._abort_enter(exc)
            raise
        except ArtifactLeaseError as exc:
            self._abort_enter(exc)
            raise ArtifactPublicationError(
                f"cannot acquire artifact publication lease: {exc}"
            ) from exc
        except OSError as exc:
            self._abort_enter(exc)
            raise ArtifactPublicationError(
                f"cannot acquire artifact writer lock: {exc}"
            ) from exc
        except Exception as exc:
            self._abort_enter(exc)
            raise

'''
          text = text[:start] + new_enter + text[end:]
          text = text.replace(
              '''            if self._lease is None:
                raise ArtifactPublicationError("publisher lease was not acquired")
            self._lease.validate_current_parent()
''',
              '''            self._validate_parent_anchor()
''',
          )
          text = text.replace("            self._lease.validate_current_parent()\n", "            self._validate_parent_anchor()\n")
          text = text.replace(
              '''                    self.backup = None
                except OSError as restore_exc:
''',
              '''                    self.backup = None
                    os.fsync(self._parent_fd())
                except OSError as restore_exc:
''',
              1,
          )
          text = text.replace(
              '''                if self.backup.exists():
                    return
                self.backup = None
''',
              '''                if not self.backup.exists():
                    self.backup = None
''',
          )
          old_finally = '''            if self._lease is not None:
                try:
                    self._lease.__exit__(exc_type, exc, traceback)
                except BaseException as lease_error:
                    if pending_error is None:
                        pending_error = lease_error
                finally:
                    self._lease = None
        if pending_error is not None:
            raise pending_error
'''
          new_finally = '''            if self._lease is not None:
                try:
                    self._lease.__exit__(exc_type, exc, traceback)
                except BaseException as lease_error:
                    if pending_error is None:
                        pending_error = lease_error
                finally:
                    self._lease = None
            try:
                self._close_parent_anchor()
            except BaseException as anchor_error:
                if pending_error is None:
                    pending_error = anchor_error
        if pending_error is not None:
            raise pending_error
'''
          if old_finally not in text:
              raise SystemExit("publisher finally block not found")
          text = text.replace(old_finally, new_finally)
          path.write_text(text)

          tests = Path("tests/test_atomic_publication.py")
          source = tests.read_text()
          source = source.replace(
              '''    def unavailable(_left: Path, _right: Path) -> None:
        raise failure

    monkeypatch.setattr(publication, "_rename_exchange", unavailable)
''',
              '''    def unavailable(_parent_fd: int, _left_name: str, _right_name: str) -> None:
        raise failure

    monkeypatch.setattr(publication, "_rename_exchange_at", unavailable)
''',
          )
          tests.write_text(source)
          PY
          patch_exit=$?
          printf '\npatch_exit=%s\n' "$patch_exit" >> review2-publication-repair.txt
          if [ "$patch_exit" -eq 0 ]; then
            python -m pip install -e ".[dev]" >> review2-publication-repair.txt 2>&1
            ruff format src/paic/artifacts/publication.py tests/test_atomic_publication.py >> review2-publication-repair.txt 2>&1
            ruff check --fix src/paic/artifacts/publication.py tests/test_atomic_publication.py >> review2-publication-repair.txt 2>&1
            pytest -q --tb=short tests/test_atomic_publication.py >> review2-publication-repair.txt 2>&1
            printf '\npytest_exit=%s\n' "$?" >> review2-publication-repair.txt
            mypy --strict src tests >> review2-publication-repair.txt 2>&1
            printf '\nmypy_exit=%s\n' "$?" >> review2-publication-repair.txt
          fi
          rm -f .github/workflows/one-shot-publication-repair.yml .review2-publication-repair-trigger review2-publication.txt
      - name: Commit repair and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair atomic publication lifecycle"
          git push origin HEAD:agent/phase11-fix-review2
