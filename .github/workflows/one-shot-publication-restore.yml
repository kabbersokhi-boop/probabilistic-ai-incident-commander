name: one-shot publication restore

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Restore original tests and fix lint
        run: |
          git show f8a10785a9c1695333f670427d52891e310ad03b:tests/test_atomic_publication.py > tests/test_atomic_publication.py
          python - <<'PY'
          from pathlib import Path

          tests_path = Path("tests/test_atomic_publication.py")
          tests = tests_path.read_text()
          tests = tests.replace(
              '    def unavailable(_left: Path, _right: Path) -> None:\n        raise failure\n\n    monkeypatch.setattr(publication, "_rename_exchange", unavailable)\n',
              '    def unavailable(_parent_fd: int, _left_name: str, _right_name: str) -> None:\n        raise failure\n\n    monkeypatch.setattr(publication, "_rename_exchange_at", unavailable)\n',
          )
          tests_path.write_text(tests)

          source_path = Path("src/paic/artifacts/publication.py")
          source = source_path.read_text()
          if "from contextlib import suppress" not in source:
              source = source.replace("import ctypes\n", "import ctypes\nfrom contextlib import suppress\n")
          source = source.replace(
              '            if descriptor is not None:\n                try:\n                    os.close(descriptor)\n                except OSError:\n                    pass\n',
              '            if descriptor is not None:\n                with suppress(OSError):\n                    os.close(descriptor)\n',
          )
          source_path.write_text(source)
          PY
          rm -f .github/workflows/one-shot-publication-restore.yml .review2-publication-restore-trigger
          rm -f .github/workflows/one-shot-publication-corrective.yml .review2-publication-corrective-trigger
          rm -f review2-publication-corrective.txt review2-publication-direct.txt
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore publication tests and fix lint"
          git push origin HEAD:agent/phase11-fix-review2
