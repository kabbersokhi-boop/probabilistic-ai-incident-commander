name: one-shot publication verification

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run publication tests
        run: |
          python -m pip install -e ".[dev]"
          set +e
          pytest -q --tb=short tests/test_atomic_publication.py > review2-publication.txt 2>&1
          printf '\npytest_exit=%s\n' "$?" >> review2-publication.txt
          rm -f .github/workflows/one-shot-publication-verify.yml .review2-publication-trigger review2-reader-boundaries.txt
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture publication verification"
          git push origin HEAD:agent/phase11-fix-review2
