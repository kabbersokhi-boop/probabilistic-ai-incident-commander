name: one-shot pytest report

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Capture concise runtime failures
        run: |
          python -m pip install -e ".[dev]"
          pytest -q --tb=short > review2-pytest.txt 2>&1 || true
      - name: Remove workflow and trigger
        run: rm .github/workflows/one-shot-pytest-report.yml .review2-pytest-trigger
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture review2 runtime diagnostics"
          git push origin HEAD:agent/phase11-fix-review2
