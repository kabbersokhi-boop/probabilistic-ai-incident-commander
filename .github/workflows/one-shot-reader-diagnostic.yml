name: one-shot reader repair diagnostic

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Extract and execute repair script
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/one-shot-reader-fix.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end]) + '\n'
          Path('/tmp/reader-repair.py').write_text(script)
          PY
          set +e
          python /tmp/reader-repair.py > review2-reader-diagnostic.txt 2>&1
          code=$?
          printf '\nexit_code=%s\n\n--- git diff --stat ---\n' "$code" >> review2-reader-diagnostic.txt
          git diff --stat >> review2-reader-diagnostic.txt
          printf '\n--- git status --short ---\n' >> review2-reader-diagnostic.txt
          git status --short >> review2-reader-diagnostic.txt
          rm -f .github/workflows/one-shot-reader-diagnostic.yml .review2-reader-diagnostic-trigger
          rm -f .github/workflows/one-shot-reader-fix.yml .review2-reader-fix-trigger
          rm -f .github/workflows/one-shot-watchdog.yml .review2-watchdog-trigger
      - name: Commit diagnostic and partial repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture reader repair diagnostic"
          git push origin HEAD:agent/phase11-fix-review2
