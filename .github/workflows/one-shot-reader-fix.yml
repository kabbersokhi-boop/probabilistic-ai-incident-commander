name: one-shot reader anchoring repair

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Repair reader anchoring without rewriting public arguments
        run: |
          python - <<'PY'
          from pathlib import Path

          lease_path = Path("src/paic/artifacts/lease.py")
          text = lease_path.read_text()
          text = text.replace(
              '_ACTIVE_ROOT_FDS: contextvars.ContextVar[dict[int, Owner] | None] = contextvars.ContextVar(\n    "paic_active_artifact_root_fds", default=None\n)\n',
              '_ACTIVE_ROOT_FDS: contextvars.ContextVar[dict[int, Owner] | None] = contextvars.ContextVar(\n    "paic_active_artifact_root_fds", default=None\n)\n_ACTIVE_ROOT_PATHS: contextvars.ContextVar[\n    dict[str, tuple[tuple[int, Owner], ...]] | None\n] = contextvars.ContextVar("paic_active_artifact_root_paths", default=None)\n'
          )
          marker = '''def _descriptor_fd(value: object) -> int | None:\n'''
          insert = '''def _active_root_paths() -> dict[str, tuple[tuple[int, Owner], ...]]:\n    return _ACTIVE_ROOT_PATHS.get() or {}\n\n\ndef _push_active_root(path: Path, fd: int, owner: Owner) -> None:\n    state = dict(_active_root_paths())\n    key = os.path.normcase(os.fspath(_canonical_root(path)))\n    state[key] = (*state.get(key, ()), (fd, owner))\n    _ACTIVE_ROOT_PATHS.set(state)\n\n\ndef _pop_active_root(path: Path, fd: int, owner: Owner) -> None:\n    state = dict(_active_root_paths())\n    key = os.path.normcase(os.fspath(_canonical_root(path)))\n    current = list(state.get(key, ()))\n    for index in range(len(current) - 1, -1, -1):\n        if current[index] == (fd, owner):\n            current.pop(index)\n            break\n    if current:\n        state[key] = tuple(current)\n    else:\n        state.pop(key, None)\n    _ACTIVE_ROOT_PATHS.set(state)\n\n\ndef _descriptor_root(fd: int) -> Path | None:\n    for base in (Path("/proc/self/fd"), Path("/dev/fd")):\n        if base.is_dir():\n            return base / str(fd)\n    return None\n\n\ndef artifact_path(path: str | Path) -> Path:\n    """Return an owner-scoped descriptor-relative path for an active artifact root."""\n\n    candidate = _canonical_root(path)\n    candidate_text = os.path.normcase(os.fspath(candidate))\n    owner = _execution_owner()\n    for root_text, entries in sorted(\n        _active_root_paths().items(), key=lambda item: len(item[0]), reverse=True\n    ):\n        if not entries or entries[-1][1] != owner:\n            continue\n        try:\n            relative = candidate.relative_to(Path(root_text))\n        except ValueError:\n            continue\n        descriptor = _descriptor_root(entries[-1][0])\n        if descriptor is None:\n            return candidate\n        return descriptor / relative\n    return candidate\n\n\ndef artifact_root_is_regular(path: str | Path) -> bool:\n    """Check an artifact root without rejecting an internal descriptor anchor."""\n\n    candidate = _canonical_root(path)\n    key = os.path.normcase(os.fspath(candidate))\n    entries = _active_root_paths().get(key, ())\n    owner = _execution_owner()\n    if entries and entries[-1][1] == owner:\n        try:\n            return stat.S_ISDIR(os.fstat(entries[-1][0]).st_mode)\n        except OSError:\n            return False\n    return not candidate.is_symlink() and candidate.is_dir()\n\n\n'''
          if insert not in text:
              text = text.replace(marker, insert + marker)
          text = text.replace(
              '''    def anchored_root(self) -> Path:\n        if self.root_fd is None:\n            return self.root\n        for base in (Path("/proc/self/fd"), Path("/dev/fd")):\n            if base.is_dir():\n                return base / str(self.root_fd)\n        raise ArtifactLeaseError("descriptor-backed artifact paths are unavailable")\n\n''',
              '''    def anchored_root(self) -> Path:\n        if self.root_fd is None:\n            return self.root\n        return _descriptor_root(self.root_fd) or self.root\n\n'''
          )
          text = text.replace(
              '''        if self.root_fd is not None:\n            _set_active_root_fd(self.root_fd, owner)\n        self._active = True\n''',
              '''        if self.root_fd is not None:\n            _set_active_root_fd(self.root_fd, owner)\n            _push_active_root(self.root, self.root_fd, owner)\n        self._active = True\n'''
          )
          text = text.replace(
              '''        if self.root_fd is not None:\n            _set_active_root_fd(self.root_fd, None)\n        self._release_active_parent()\n''',
              '''        if self.root_fd is not None:\n            owner = _execution_owner()\n            _pop_active_root(self.root, self.root_fd, owner)\n            _set_active_root_fd(self.root_fd, None)\n        self._release_active_parent()\n'''
          )
          old_wrapper = '''        with artifact_reader_leases(roots) as anchored:\n            for name in root_names:\n                value = bound.arguments.get(name)\n                if value is not None and not _is_active_descriptor_root(value):\n                    key = os.path.normcase(os.fspath(_canonical_root(value)))\n                    bound.arguments[name] = anchored.get(key, value)\n            return func(*bound.args, **bound.kwargs)\n'''
          new_wrapper = '''        with artifact_reader_leases(roots):\n            return func(*bound.args, **bound.kwargs)\n'''
          if old_wrapper not in text:
              raise SystemExit("reader wrapper block not found")
          text = text.replace(old_wrapper, new_wrapper)
          lease_path.write_text(text)

          files = [
              "src/paic/analytics/io.py",
              "src/paic/analytics/validation.py",
              "src/paic/detection/io.py",
              "src/paic/detection/validation.py",
              "src/paic/evaluation/artifact.py",
              "src/paic/evaluation/comparison.py",
              "src/paic/evidence/io.py",
              "src/paic/evidence/validation.py",
              "src/paic/impact/io.py",
              "src/paic/impact/validation.py",
              "src/paic/investigation/artifact.py",
              "src/paic/recovery/artifact.py",
              "src/paic/recovery/observations.py",
              "src/paic/remediation/artifact.py",
              "src/paic/simulator/io.py",
              "src/paic/simulator/validation.py",
          ]
          root_assignments = {
              "root = Path(analytics_dir)": "root = artifact_path(analytics_dir)",
              "root = Path(detection_dir)": "root = artifact_path(detection_dir)",
              "root = Path(evidence_dir)": "root = artifact_path(evidence_dir)",
              "root = Path(impact_dir)": "root = artifact_path(impact_dir)",
              "root = Path(dataset_dir)": "root = artifact_path(dataset_dir)",
              "root = Path(path)": "root = artifact_path(path)",
              "path = Path(root)": "path = artifact_path(root)",
              "target = Path(root)": "target = artifact_path(root)",
              "source_root = Path(dataset_dir)": "source_root = artifact_path(dataset_dir)",
              "analytics_root = Path(analytics_dir)": "analytics_root = artifact_path(analytics_dir)",
              "path = Path(analytics_dir) / \"manifest.json\"": "path = artifact_path(Path(analytics_dir) / \"manifest.json\")",
              "path = Path(detection_dir) / \"manifest.json\"": "path = artifact_path(Path(detection_dir) / \"manifest.json\")",
              "path = Path(evidence_dir) / \"manifest.json\"": "path = artifact_path(Path(evidence_dir) / \"manifest.json\")",
              "path = Path(impact_dir) / \"manifest.json\"": "path = artifact_path(Path(impact_dir) / \"manifest.json\")",
              "path = Path(dataset_dir) / \"manifest.json\"": "path = artifact_path(Path(dataset_dir) / \"manifest.json\")",
              "return file_sha256(Path(path) / \"manifest.json\")": "return file_sha256(artifact_path(Path(path) / \"manifest.json\"))",
              "return str(file_sha256(Path(path) / \"manifest.json\"))": "return str(file_sha256(artifact_path(Path(path) / \"manifest.json\")))",
          }
          for filename in files:
              path = Path(filename)
              source = path.read_text()
              if "from paic.artifacts.lease import" not in source:
                  raise SystemExit(f"missing lease import in {filename}")
              if "artifact_path" not in source.split("\n", 80)[0:80]:
                  if "from paic.artifacts.lease import (" in source:
                      source = source.replace(
                          "from paic.artifacts.lease import (\n",
                          "from paic.artifacts.lease import (\n    artifact_path,\n    artifact_root_is_regular,\n",
                          1,
                      )
                  else:
                      lines = source.splitlines()
                      for i, line in enumerate(lines):
                          if line.startswith("from paic.artifacts.lease import "):
                              names = line.removeprefix("from paic.artifacts.lease import ")
                              lines[i] = "from paic.artifacts.lease import artifact_path, artifact_root_is_regular, " + names
                              break
                      source = "\n".join(lines) + ("\n" if source.endswith("\n") else "")
              for old, new in root_assignments.items():
                  source = source.replace(old, new)
              source = source.replace("Path(root) / \"calibration.json\"", "artifact_path(Path(root) / \"calibration.json\")")
              source = source.replace("Path(root) / \"safety-results.json\"", "artifact_path(Path(root) / \"safety-results.json\")")
              source = source.replace("Path(config_path).read_text", "artifact_path(config_path).read_text")
              source = source.replace("Path(dataset_dir) / \"manifest.json\"", "artifact_path(Path(dataset_dir) / \"manifest.json\")")
              source = source.replace("Path(analytics_dir) / \"manifest.json\"", "artifact_path(Path(analytics_dir) / \"manifest.json\")")
              source = source.replace("if root.is_symlink() or not root.is_dir():", "if not artifact_root_is_regular(root):")
              source = source.replace("if not root.is_dir() or root.is_symlink():", "if not artifact_root_is_regular(root):")
              source = source.replace("if path.is_symlink() or not path.is_dir():", "if not artifact_root_is_regular(path):")
              source = source.replace("if root.is_symlink() or not root.is_dir() or", "if not artifact_root_is_regular(root) or")
              path.write_text(source)
          PY
          python -m pip install -e ".[dev]"
          ruff format src/paic tests
          ruff check --fix src/paic tests
          pytest -q tests/test_artifact_lease.py tests/test_artifact_lease_nested.py tests/test_evaluation.py tests/test_investigation_cli.py tests/test_investigation_evaluation.py tests/test_investigation_orchestrator.py > review2-reader-fix.txt 2>&1 || true
          mypy --strict src tests >> review2-reader-fix.txt 2>&1 || true
      - name: Remove workflow, trigger, and old diagnostics
        run: rm .github/workflows/one-shot-reader-fix.yml .review2-reader-fix-trigger review2-pytest.txt review2-reader-inventory.txt
      - name: Commit repair and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair descriptor-anchored artifact readers"
          git push origin HEAD:agent/phase11-fix-review2
