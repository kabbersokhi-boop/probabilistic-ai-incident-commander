name: one-shot descriptor root recognition fix

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Patch and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/paic/artifacts/lease.py')
          text = path.read_text()
          text = text.replace('    candidate_text = os.path.normcase(os.fspath(candidate))\n', '')
          old = '''    candidate = _canonical_root(path)\n    key = os.path.normcase(os.fspath(candidate))\n    entries = _active_root_paths().get(key, ())\n    owner = _execution_owner()\n    if entries and entries[-1][1] == owner:\n        try:\n            return stat.S_ISDIR(os.fstat(entries[-1][0]).st_mode)\n        except OSError:\n            return False\n    return not candidate.is_symlink() and candidate.is_dir()\n'''
          new = '''    descriptor_fd = _descriptor_fd(path)\n    owner = _execution_owner()\n    if descriptor_fd is not None and _active_root_fds().get(descriptor_fd) == owner:\n        try:\n            return stat.S_ISDIR(os.fstat(descriptor_fd).st_mode)\n        except OSError:\n            return False\n    candidate = _canonical_root(path)\n    key = os.path.normcase(os.fspath(candidate))\n    entries = _active_root_paths().get(key, ())\n    if entries and entries[-1][1] == owner:\n        try:\n            return stat.S_ISDIR(os.fstat(entries[-1][0]).st_mode)\n        except OSError:\n            return False\n    return not candidate.is_symlink() and candidate.is_dir()\n'''
          if old not in text:
              raise SystemExit('artifact_root_is_regular block not found')
          path.write_text(text.replace(old, new))
          PY
          python -m pip install -e ".[dev]"
          ruff check --fix src/paic tests
          ruff format src/paic tests
          set +e
          {
            ruff format --check src/paic tests; echo "ruff_format_exit=$?"
            ruff check src/paic tests; echo "ruff_check_exit=$?"
            pytest -q --tb=short tests/test_artifact_lease.py tests/test_artifact_lease_nested.py tests/test_evaluation.py tests/test_investigation_cli.py tests/test_investigation_evaluation.py tests/test_investigation_orchestrator.py; echo "pytest_exit=$?"
            mypy --strict src tests; echo "mypy_exit=$?"
          } > review2-reader-fix2.txt 2>&1
          rm -f .github/workflows/one-shot-reader-fix2.yml .review2-reader-fix2-trigger
          rm -f review2-reader-diagnostic.txt review2-reader-verify.txt review2-workflow-watchdog.txt
      - name: Commit fix and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recognize active descriptor roots"
          git push origin HEAD:agent/phase11-fix-review2
