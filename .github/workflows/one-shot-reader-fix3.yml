name: one-shot anchored proxy and teardown fix

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Patch and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/paic/artifacts/lease.py')
          text = path.read_text()
          marker = '''def artifact_path(path: str | Path) -> Path:\n'''
          proxy = '''class _AnchoredRoot(os.PathLike[str]):\n    """Transparent root argument whose operations use a descriptor anchor."""\n\n    def __init__(self, lexical: Path, anchored: Path):\n        self.lexical = lexical\n        self.anchored = anchored\n\n    def __fspath__(self) -> str:\n        return os.fspath(self.anchored)\n\n    def __str__(self) -> str:\n        return os.fspath(self.lexical)\n\n    def __repr__(self) -> str:\n        return repr(self.lexical)\n\n    def __hash__(self) -> int:\n        return hash(self.lexical)\n\n    def __eq__(self, other: object) -> bool:\n        if isinstance(other, _AnchoredRoot):\n            return self.lexical == other.lexical\n        if isinstance(other, (str, os.PathLike)):\n            return self.lexical == Path(os.fspath(other))\n        return False\n\n    def __truediv__(self, key: str | os.PathLike[str]) -> Path:\n        return self.anchored / key\n\n    def __getattr__(self, name: str) -> object:\n        return getattr(self.anchored, name)\n\n\n'''
          if proxy not in text:
              text = text.replace(marker, proxy + marker)
          old_wrapper = '''        with artifact_reader_leases(roots):\n            return func(*bound.args, **bound.kwargs)\n'''
          new_wrapper = '''        with artifact_reader_leases(roots) as anchored:\n            for name in root_names:\n                value = bound.arguments.get(name)\n                if value is not None and not _is_active_descriptor_root(value):\n                    key = os.path.normcase(os.fspath(_canonical_root(value)))\n                    replacement = anchored.get(key)\n                    if replacement is not None:\n                        bound.arguments[name] = _AnchoredRoot(_canonical_root(value), replacement)\n            return func(*bound.args, **bound.kwargs)\n'''
          if old_wrapper not in text:
              raise SystemExit('wrapper block not found')
          text = text.replace(old_wrapper, new_wrapper)
          old_reentrant = '''            root_error = _release_descriptor("artifact root", self.root_fd, False)\n            close_error = _release_descriptor("artifact parent", self.parent_fd, False)\n            self.root_fd = None\n            self.root_info = None\n            self.parent_fd = None\n            self.parent_info = None\n            self._unmark_active()\n'''
          new_reentrant = '''            self._unmark_active()\n            root_error = _release_descriptor("artifact root", self.root_fd, False)\n            close_error = _release_descriptor("artifact parent", self.parent_fd, False)\n            self.root_fd = None\n            self.root_info = None\n            self.parent_fd = None\n            self.parent_info = None\n'''
          if old_reentrant not in text:
              raise SystemExit('reentrant release block not found')
          text = text.replace(old_reentrant, new_reentrant)
          old_normal = '''        errors: list[ArtifactLeaseError] = []\n        for name, fd, locked in (\n'''
          new_normal = '''        errors: list[ArtifactLeaseError] = []\n        self._unmark_active()\n        for name, fd, locked in (\n'''
          text = text.replace(old_normal, new_normal, 1)
          text = text.replace('        self._unmark_active()\n        if errors:\n', '        if errors:\n', 1)
          path.write_text(text)
          PY
          python -m pip install -e ".[dev]"
          ruff check --fix src/paic tests
          ruff format src/paic tests
          set +e
          {
            ruff format --check src/paic tests; echo "ruff_format_exit=$?"
            ruff check src/paic tests; echo "ruff_check_exit=$?"
            pytest -q --tb=short tests/test_artifact_lease.py tests/test_artifact_lease_nested.py tests/test_evaluation.py tests/test_investigation_cli.py tests/test_investigation_evaluation.py tests/test_investigation_orchestrator.py; echo "pytest_exit=$?"
            mypy --strict src tests; echo "mypy_exit=$?"
          } > review2-reader-fix3.txt 2>&1
          rm -f .github/workflows/one-shot-reader-fix3.yml .review2-reader-fix3-trigger review2-reader-fix2.txt
      - name: Commit fix and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve transparent anchored reader roots"
          git push origin HEAD:agent/phase11-fix-review2
