name: one-shot final reader anchoring repair

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Patch reader and benchmark anchoring
        run: |
          python - <<'PY'
          from pathlib import Path

          lease = Path('src/paic/artifacts/lease.py')
          text = lease.read_text()
          start = text.find('class _AnchoredRoot(os.PathLike[str]):\n')
          end = text.find('\ndef artifact_path(path: str | Path) -> Path:\n', start)
          if start != -1 and end != -1:
              text = text[:start] + text[end + 1:]
          old = '''        with artifact_reader_leases(roots) as anchored:\n            for name in root_names:\n                value = bound.arguments.get(name)\n                if value is not None and not _is_active_descriptor_root(value):\n                    key = os.path.normcase(os.fspath(_canonical_root(value)))\n                    replacement = anchored.get(key)\n                    if replacement is not None:\n                        bound.arguments[name] = _AnchoredRoot(_canonical_root(value), replacement)\n            return func(*bound.args, **bound.kwargs)\n'''
          new = '''        with artifact_reader_leases(roots):\n            return func(*bound.args, **bound.kwargs)\n'''
          if old not in text:
              raise SystemExit('reader wrapper substitution block not found')
          lease.write_text(text.replace(old, new))

          benchmark = Path('src/paic/evaluation/benchmark.py')
          text = benchmark.read_text()
          text = text.replace(
              'from paic.evaluation.models import EvaluationConfig, HiddenAnswerKey, Prediction, VisibleCase\n',
              'from paic.artifacts.lease import artifact_path, artifact_readers, artifact_root_is_regular\nfrom paic.evaluation.models import EvaluationConfig, HiddenAnswerKey, Prediction, VisibleCase\n',
          )
          old_regular = '''def _regular_file(path: Path, label: str) -> Path:\n    try:\n        resolved = path.resolve(strict=True)\n    except OSError as exc:\n        raise BenchmarkError(f"{label} is unavailable: {path}") from exc\n    if path.is_symlink() or not resolved.is_file():\n        raise BenchmarkError(f"{label} must be a regular non-symlink file")\n    return resolved\n'''
          new_regular = '''def _regular_file(path: Path, label: str) -> Path:\n    anchored = artifact_path(path)\n    try:\n        if anchored.is_symlink() or not anchored.is_file():\n            raise BenchmarkError(f"{label} must be a regular non-symlink file")\n    except OSError as exc:\n        raise BenchmarkError(f"{label} is unavailable: {path}") from exc\n    return anchored\n'''
          if old_regular not in text:
              raise SystemExit('benchmark regular file block not found')
          text = text.replace(old_regular, new_regular)
          old_distinct = '''def _validate_distinct_roots(visible_root: Path, answer_root: Path) -> None:\n    try:\n        visible = visible_root.resolve(strict=True)\n        answers = answer_root.resolve(strict=True)\n    except OSError as exc:\n        raise BenchmarkError("benchmark roots must exist") from exc\n    if visible_root.is_symlink() or answer_root.is_symlink():\n        raise BenchmarkError("benchmark roots must not be symlinks")\n    if not visible.is_dir() or not answers.is_dir():\n        raise BenchmarkError("benchmark roots must be directories")\n    if visible == answers or visible in answers.parents or answers in visible.parents:\n        raise BenchmarkError("visible and hidden roots must be separate and non-nested")\n'''
          new_distinct = '''def _validate_distinct_roots(visible_root: Path, answer_root: Path) -> None:\n    try:\n        visible = visible_root.resolve(strict=True)\n        answers = answer_root.resolve(strict=True)\n    except OSError as exc:\n        raise BenchmarkError("benchmark roots must exist") from exc\n    if visible_root.is_symlink() or answer_root.is_symlink():\n        raise BenchmarkError("benchmark roots must not be symlinks")\n    if not artifact_root_is_regular(visible_root) or not artifact_root_is_regular(answer_root):\n        raise BenchmarkError("benchmark roots must be directories")\n    if visible == answers or visible in answers.parents or answers in visible.parents:\n        raise BenchmarkError("visible and hidden roots must be separate and non-nested")\n'''
          if old_distinct not in text:
              raise SystemExit('benchmark distinct roots block not found')
          text = text.replace(old_distinct, new_distinct)
          old_load = '''def load_benchmark(\n    visible_dir: str | Path, answers_dir: str | Path\n) -> tuple[list[VisibleCase], list[HiddenAnswerKey], str, str]:\n    visible_root = Path(visible_dir)\n    answer_root = Path(answers_dir)\n    _validate_distinct_roots(visible_root, answer_root)\n    visible = _load_model_list(visible_root / "cases.json", VisibleCase, "visible cases")\n    answers = _load_model_list(answer_root / "answer-keys.json", HiddenAnswerKey, "answer keys")\n'''
          new_load = '''@artifact_readers("visible_dir", "answers_dir")\ndef load_benchmark(\n    visible_dir: str | Path, answers_dir: str | Path\n) -> tuple[list[VisibleCase], list[HiddenAnswerKey], str, str]:\n    visible_lexical = Path(visible_dir)\n    answer_lexical = Path(answers_dir)\n    _validate_distinct_roots(visible_lexical, answer_lexical)\n    visible_root = artifact_path(visible_lexical)\n    answer_root = artifact_path(answer_lexical)\n    visible = _load_model_list(visible_root / "cases.json", VisibleCase, "visible cases")\n    answers = _load_model_list(answer_root / "answer-keys.json", HiddenAnswerKey, "answer keys")\n'''
          if old_load not in text:
              raise SystemExit('load_benchmark block not found')
          benchmark.write_text(text.replace(old_load, new_load))

          test_path = Path('tests/test_artifact_lease_nested.py')
          text = test_path.read_text()
          if 'artifact_path' not in text.split('\n', 40)[0:40]:
              text = text.replace(
                  'from paic.artifacts.lease import ',
                  'from paic.artifacts.lease import artifact_path, ',
                  1,
              )
          text = text.replace(
              'return (Path(path) / "value").read_text(encoding="utf-8")',
              'return (artifact_path(path) / "value").read_text(encoding="utf-8")',
          )
          test_path.write_text(text)
          PY
          python -m pip install -e ".[dev]"
          ruff check --fix src/paic tests
          ruff format src/paic tests
          set +e
          {
            ruff format --check src/paic tests; echo "ruff_format_exit=$?"
            ruff check src/paic tests; echo "ruff_check_exit=$?"
            pytest -q --tb=short tests/test_artifact_lease.py tests/test_artifact_lease_nested.py tests/test_evaluation.py tests/test_investigation_cli.py tests/test_investigation_evaluation.py tests/test_investigation_orchestrator.py; echo "pytest_exit=$?"
            mypy --strict src tests; echo "mypy_exit=$?"
          } > review2-reader-fix5.txt 2>&1
          rm -f .github/workflows/one-shot-reader-fix5.yml .review2-reader-fix5-trigger review2-reader-verify4.txt
      - name: Commit repair and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete transparent anchored reader repair"
          git push origin HEAD:agent/phase11-fix-review2
