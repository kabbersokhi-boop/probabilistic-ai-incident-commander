name: one-shot reader inventory

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Inventory decorated reader path operations
        run: |
          python - <<'PY'
          from pathlib import Path
          interesting = ("@artifact_reader", "@artifact_readers", "Path(", "is_symlink", "is_dir", "iterdir", ".open(", "read_text", "read_bytes", ".stat(", ".glob(", ".rglob(")
          out = []
          for path in sorted(Path("src/paic").rglob("*.py")):
              text = path.read_text()
              if "@artifact_reader" not in text and "@artifact_readers" not in text:
                  continue
              out.append(f"## {path}")
              for number, line in enumerate(text.splitlines(), 1):
                  if any(token in line for token in interesting):
                      out.append(f"{number}: {line}")
              out.append("")
          Path("review2-reader-inventory.txt").write_text("\n".join(out) + "\n")
          PY
      - name: Remove workflow and trigger
        run: rm .github/workflows/one-shot-reader-inventory.yml .review2-reader-inventory-trigger
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture decorated reader inventory"
          git push origin HEAD:agent/phase11-fix-review2
