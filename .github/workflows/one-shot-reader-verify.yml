name: one-shot reader verification

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run focused checks
        run: |
          python -m pip install -e ".[dev]"
          set +e
          {
            echo '=== ruff format ==='
            ruff format --check src/paic tests
            echo "ruff_format_exit=$?"
            echo '=== ruff check ==='
            ruff check src/paic tests
            echo "ruff_check_exit=$?"
            echo '=== focused pytest ==='
            pytest -q --tb=short tests/test_artifact_lease.py tests/test_artifact_lease_nested.py tests/test_evaluation.py tests/test_investigation_cli.py tests/test_investigation_evaluation.py tests/test_investigation_orchestrator.py
            echo "pytest_exit=$?"
            echo '=== mypy ==='
            mypy --strict src tests
            echo "mypy_exit=$?"
          } > review2-reader-verify.txt 2>&1
          rm .github/workflows/one-shot-reader-verify.yml .review2-reader-verify-trigger
      - name: Commit verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture reader verification report"
          git push origin HEAD:agent/phase11-fix-review2
