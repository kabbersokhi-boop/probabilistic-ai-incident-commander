name: one-shot current-tree reader verification

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify current tree
        run: |
          python -m pip install -e ".[dev]"
          set +e
          {
            ruff format --check src/paic tests; echo "ruff_format_exit=$?"
            ruff check src/paic tests; echo "ruff_check_exit=$?"
            pytest -q --tb=short tests/test_artifact_lease.py tests/test_artifact_lease_nested.py tests/test_evaluation.py tests/test_investigation_cli.py tests/test_investigation_evaluation.py tests/test_investigation_orchestrator.py; echo "pytest_exit=$?"
            mypy --strict src tests; echo "mypy_exit=$?"
          } > review2-reader-verify4.txt 2>&1
          rm -f .github/workflows/one-shot-reader-verify4.yml .review2-reader-verify4-trigger
          rm -f .github/workflows/one-shot-fix3-diagnostic.yml .review2-fix3-diagnostic-trigger
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture current reader verification"
          git push origin HEAD:agent/phase11-fix-review2
