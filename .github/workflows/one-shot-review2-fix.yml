name: one-shot review2 repair

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply descriptor-anchored repair
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/paic/artifacts/publication.py",
              '    def _parent_entry(self, name: str) -> Path:\n        return Path(f"/proc/self/fd/{self._parent_fd()}") / name\n',
              '    def _parent_entry(self, name: str) -> Path:\n        """Return the lexical sibling path while descriptor-relative syscalls stay authoritative."""\n        return self._root.parent / name\n',
          )
          replace(
              "src/paic/artifacts/publication.py",
              '            if self.staging is not None:\n                shutil.rmtree(self.staging, ignore_errors=True)\n                self.staging = None\n',
              '            if self.staging is not None:\n                try:\n                    shutil.rmtree(self.staging)\n                except FileNotFoundError:\n                    pass\n                except OSError as cleanup_exc:\n                    raise ArtifactPublicationError(\n                        f"artifact staging cleanup failed: {cleanup_exc}"\n                    ) from cleanup_exc\n                self.staging = None\n',
          )

          replace(
              "src/paic/artifacts/lease.py",
              'from typing import Literal, ParamSpec, TypeVar\n',
              'from typing import Literal, NamedTuple, ParamSpec, TypeVar, cast\n',
          )
          replace(
              "src/paic/artifacts/lease.py",
              '    return parts  # type: ignore[return-value]\n',
              '    return cast(tuple[int, int, int, int], parts)\n',
          )
          replace(
              "src/paic/artifacts/lease.py",
              '        self.identity_fd: int | None = None\n        self.lease_fd: int | None = None\n',
              '        self.identity_fd: int | None = None\n        self.lease_fd: int | None = None\n        self.root_fd: int | None = None\n        self.root_info: os.stat_result | None = None\n',
          )
          replace(
              "src/paic/artifacts/lease.py",
              '    def _enter_reentrant_if_safe(self) -> bool:\n',
              '    def _open_root_anchor(self) -> None:\n        if self.parent_fd is None or self.parent_info is None:\n            raise ArtifactLeaseError("artifact lease parent was not acquired")\n        flags = os.O_RDONLY | getattr(os, "O_DIRECTORY", 0)\n        flags |= getattr(os, "O_CLOEXEC", 0) | getattr(os, "O_NOFOLLOW", 0)\n        try:\n            self.root_fd = os.open(self.root.name, flags, dir_fd=self.parent_fd)\n        except FileNotFoundError:\n            self.root_fd = None\n            self.root_info = None\n            return\n        except OSError as exc:\n            raise ArtifactLeaseError(f"cannot anchor artifact root: {exc}") from exc\n        self.root_info = os.fstat(self.root_fd)\n        if not stat.S_ISDIR(self.root_info.st_mode):\n            raise ArtifactLeaseError("artifact root must be a regular directory")\n        current = os.stat(self.root.name, dir_fd=self.parent_fd, follow_symlinks=False)\n        if not _identity(self.root_info, current):\n            raise ArtifactLeaseError("artifact root changed during acquisition")\n\n    def anchored_root(self) -> Path:\n        if self.root_fd is None:\n            return self.root\n        for base in (Path("/proc/self/fd"), Path("/dev/fd")):\n            if base.is_dir():\n                return base / str(self.root_fd)\n        raise ArtifactLeaseError("descriptor-backed artifact paths are unavailable")\n\n    def _enter_reentrant_if_safe(self) -> bool:\n',
          )
          replace(
              "src/paic/artifacts/lease.py",
              '        self.parent_fd, self.parent_info = _open_parent(self.parent)\n        self._reentrant = True\n',
              '        self.parent_fd, self.parent_info = _open_parent(self.parent)\n        self._open_root_anchor()\n        self._reentrant = True\n',
          )
          replace(
              "src/paic/artifacts/lease.py",
              '        if self._reentrant:\n            self.lease_locked = True\n            return\n',
              '        if self._reentrant:\n            self.validate_current_parent()\n            self.lease_locked = True\n            return\n',
          )
          replace(
              "src/paic/artifacts/lease.py",
              '            self.validate_current_parent()\n            self.lease_locked = True\n            self._mark_active()\n',
              '            self.validate_current_parent()\n            self._open_root_anchor()\n            self.lease_locked = True\n            self._mark_active()\n',
          )
          replace(
              "src/paic/artifacts/lease.py",
              '            close_error = _release_descriptor("artifact parent", self.parent_fd, False)\n            self.parent_fd = None\n',
              '            root_error = _release_descriptor("artifact root", self.root_fd, False)\n            close_error = _release_descriptor("artifact parent", self.parent_fd, False)\n            self.root_fd = None\n            self.root_info = None\n            self.parent_fd = None\n',
          )
          replace(
              "src/paic/artifacts/lease.py",
              '            if close_error is not None:\n                raise close_error\n',
              '            if root_error is not None:\n                raise root_error\n            if close_error is not None:\n                raise close_error\n',
          )
          replace(
              "src/paic/artifacts/lease.py",
              '            ("artifact data", self.lease_fd, self.lease_locked),\n',
              '            ("artifact root", self.root_fd, False),\n            ("artifact data", self.lease_fd, self.lease_locked),\n',
          )
          replace(
              "src/paic/artifacts/lease.py",
              '        self.lease_fd = self.identity_fd = self.parent_fd = self.domain_fd = self.gate_fd = None\n',
              '        self.root_fd = self.lease_fd = self.identity_fd = self.parent_fd = self.domain_fd = self.gate_fd = None\n        self.root_info = None\n',
          )
          replace(
              "src/paic/artifacts/lease.py",
              '        roots = [bound.arguments.get(name) for name in root_names]\n        with artifact_reader_leases(roots):\n            return func(*args, **kwargs)\n',
              '        roots = [bound.arguments.get(name) for name in root_names]\n        with artifact_reader_leases(roots) as anchored:\n            for name in root_names:\n                value = bound.arguments.get(name)\n                if value is not None:\n                    key = os.path.normcase(os.fspath(_canonical_root(value)))\n                    bound.arguments[name] = anchored.get(key, value)\n            return func(*bound.args, **bound.kwargs)\n',
          )
          replace(
              "src/paic/artifacts/lease.py",
              'def artifact_reader_leases(roots: Sequence[str | Path | None]) -> Iterator[None]:\n',
              'def artifact_reader_leases(\n    roots: Sequence[str | Path | None],\n) -> Iterator[dict[str, Path]]:\n',
          )
          replace(
              "src/paic/artifacts/lease.py",
              '    with ExitStack() as stack:\n        for key in sorted(ordered):\n            stack.enter_context(_ArtifactLease(ordered[key], exclusive=False))\n        yield\n',
              '    leases = [(key, _ArtifactLease(ordered[key], exclusive=False)) for key in sorted(ordered)]\n    with ExitStack() as stack:\n        anchored: dict[str, Path] = {}\n        for key, lease in leases:\n            stack.enter_context(lease)\n            anchored[key] = lease.anchored_root()\n        yield anchored\n',
          )
          PY
      - name: Install tooling
        run: python -m pip install -e ".[dev]"
      - name: Format and lint
        run: |
          ruff format .
          ruff check --fix .
          ruff format .
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/one-shot-review2-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Anchor artifact reads and repair publication staging"
          git push origin HEAD:agent/phase11-fix-review2
