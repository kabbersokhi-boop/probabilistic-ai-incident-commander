name: one-shot review2 lint cleanup

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply safe lint cleanup
        run: |
          python -m pip install -e ".[dev]"
          ruff check --fix .
          ruff format .
          ruff check .
          mypy src tests
      - name: Remove workflow and trigger
        run: rm .github/workflows/one-shot-review2-lint.yml .review2-lint-trigger
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply review2 lint cleanup"
          git push origin HEAD:agent/phase11-fix-review2
