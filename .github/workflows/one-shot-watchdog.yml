name: one-shot workflow watchdog

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Capture workflow execution
        run: |
          printf 'head=%s\n' "${GITHUB_SHA}" > review2-workflow-watchdog.txt
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort >> review2-workflow-watchdog.txt
          rm .github/workflows/one-shot-watchdog.yml .review2-watchdog-trigger
      - name: Commit watchdog report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture workflow watchdog report"
          git push origin HEAD:agent/phase11-fix-review2
