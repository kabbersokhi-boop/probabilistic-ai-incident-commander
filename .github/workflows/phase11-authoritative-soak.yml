name: Phase 11 inspection and authoritative soak

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: phase11-authoritative-soak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authoritative-soak:
    name: concise compatibility diagnostic (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out commit
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install quietly
        run: python -m pip install -e ".[dev]" --quiet
      - name: Run focused compatibility tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set +e
          python -m pytest -q --tb=short \
            tests/test_atomic_publication.py::test_failed_rollback_preserves_backup_and_reports_recovery_path \
            tests/test_investigation_unit.py::test_artifact_semantic_tampering_and_source_mismatch \
            > focused-pytest.txt 2>&1
          status=$?
          tail -n 120 focused-pytest.txt
          exit "$status"
