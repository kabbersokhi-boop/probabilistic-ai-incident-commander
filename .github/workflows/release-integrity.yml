name: Release integrity evidence

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  static-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Verify exact checked-out commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Generate and validate release bundle
        run: |
          make web-bundle web-validate
          python scripts/scan_repository_secrets.py
      - name: Attest validated static artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: .artifacts/web-bundle/*
      - name: Upload release integrity evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-integrity-${{ github.sha }}
          path: .artifacts/web-bundle
          if-no-files-found: error
          retention-days: 90
