name: Apply Ruff formatting hotfix

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase11-fix-review2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Format and commit
        run: |
          python -m pip install ruff
          ruff format src/paic/artifacts/lease.py
          rm .github/workflows/review2-format-hotfix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: format artifact root anchor fix"
          git push origin HEAD:agent/phase11-fix-review2
