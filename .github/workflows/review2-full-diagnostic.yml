name: Capture full-suite failures

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase11-fix-review2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Capture full-suite failures
        continue-on-error: true
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q > review2-full-diagnostic.log 2>&1
      - name: Commit diagnostic log and clean debris
        if: always()
        run: |
          rm .github/workflows/review2-full-diagnostic.yml
          rm -f configs/evaluation/.answers.lease configs/evaluation/.smoke.lease configs/evaluation/.standard.lease
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git add -f review2-full-diagnostic.log
          git commit -m 'chore: capture full-suite test failures'
          git push origin HEAD:agent/phase11-fix-review2
