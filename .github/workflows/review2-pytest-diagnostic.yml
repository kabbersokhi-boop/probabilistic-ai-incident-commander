name: Capture lease regression failures

on:
  push:
    branches: [agent/phase11-fix-review2]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase11-fix-review2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Capture pytest failures
        continue-on-error: true
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q > pytest-diagnostic.log 2>&1
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review2-pytest-diagnostic
          path: pytest-diagnostic.log
      - name: Remove diagnostic workflow
        if: always()
        run: |
          rm .github/workflows/review2-pytest-diagnostic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: remove pytest diagnostic workflow'
          git push origin HEAD:agent/phase11-fix-review2
