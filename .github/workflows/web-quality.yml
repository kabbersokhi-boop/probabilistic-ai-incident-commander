name: web quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Install exporter
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Validate deterministic bundle
        run: make web-bundle web-validate
      - name: Install, lint, audit, and build frontend
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Check public build has no machine paths or secrets
        run: |
          test -f web/dist/data/bundle.json
          ! rg -n --hidden '/home/|\\\\|PAIC_APPROVAL_SECRET|BEGIN .*PRIVATE' web/dist
