schema_version: "1.0"
detection_id: checkout-address-validation-reference
timezone: UTC
selectors:
  - metric: checkout_conversion_rate
    time_grains: [day]
    cohorts: [region]
  - metric: payment_approval_rate
    time_grains: [day]
    cohorts: [overall]
baseline:
  hour:
    lookback_periods: 168
    minimum_history: 72
    seasonal_periods: 24
    minimum_seasonal_history: 3
    minimum_scale: 0.000001
    relative_scale_floor: 0.01
  day:
    lookback_periods: 14
    minimum_history: 7
    seasonal_periods: 7
    minimum_seasonal_history: 2
    minimum_scale: 0.000001
    relative_scale_floor: 0.01
cusum:
  enabled: true
  drift: 0.5
  threshold: 4.5
sequential:
  enabled: true
  alpha: 0.01
  alternative_standardized_shift: 1.5
alert_policy:
  fdr_alpha: 0.05
  robust_z_threshold: 3.0
  minimum_detector_support: 2
  minimum_relative_effect: 0.20
  minimum_absolute_effect: 0.0
  minimum_sample_size: 5
metric_overrides:
  - metric: checkout_conversion_rate
    minimum_relative_effect: 0.25
    minimum_sample_size: 5
  - metric: payment_approval_rate
    minimum_relative_effect: 0.25
    minimum_sample_size: 5
benchmark_scenarios:
  - scenario_id: checkout-address-validation-south-drop
    metric: checkout_conversion_rate
    time_grain: day
    cohort: region
    dimension_values: {region: IN-SOUTH}
    start_at: "2026-01-16T00:00:00Z"
    duration_periods: 1
    kind: level_shift
    magnitude: -0.45
    expected_direction: decrease
output:
  compression: zstd
  compression_level: 6
  row_group_size: 50000
  include_statistics: true
